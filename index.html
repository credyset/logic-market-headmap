<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logic Market Heatmap</title>
  <style>
    :root{--ink:#07152e;--lime:#e0fd2c;--bg:#f5f5f3;--muted:#596579;--line:#d9dfeb;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{padding:30px 24px 64px}.tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin-bottom:28px}.tab{border:0;background:transparent;padding:13px 22px;font:inherit;font-weight:750;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:var(--ink);border-color:var(--lime)}.panel{display:none}.panel.active{display:block}.report-frame{width:100%;height:900px;border:1px solid var(--line);border-radius:10px;background:var(--white)}.note{border-left:4px solid var(--lime);background:#fffde8;padding:14px 16px;margin:20px 0}.meta{font-size:13px;color:var(--muted)}footer{max-width:1100px;margin:0 auto;padding:0 24px 30px;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <header><div><span class="eyebrow">LOGIC INC</span><h1>Market Heatmap</h1><p class="hero-copy">One shared review surface for two distinct motions: Logic Agency operations and Logic Pac packaging.</p></div></header>
  <main>
    <nav class="tabs" aria-label="Heatmap sections"><button class="tab active" data-tab="agency">Agency</button><button class="tab" data-tab="pac">Pac</button></nav>
    <section class="panel active" id="agency">
      <iframe class="report-frame" title="Logic Agency Heatmap" src="agency/agency-heatmap-report.html"></iframe>
    </section>
    <section class="panel" id="pac">
      <iframe class="report-frame" title="Logic Pac Heatmap" src="pac/pac-heatmap-report.html"></iframe>
    </section>
  </main>
  <footer>Working research project · Counts are corpus signals, not market-size estimates.</footer>
  <script>document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}));</script>
</body>
</html>
